<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
  <title id="title">ArcadeBridge quick start</title><desc id="desc">Five steps for a Host and four steps for a player.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080c20"/><stop offset="1" stop-color="#1e0c29"/></linearGradient><linearGradient id="a"><stop stop-color="#35e9ff"/><stop offset="1" stop-color="#ff2bad"/></linearGradient><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#ff3db8"/></marker></defs>
  <rect width="1400" height="680" rx="24" fill="url(#bg)"/>
  <text x="700" y="58" text-anchor="middle" font-family="Segoe UI,Arial" font-size="34" font-weight="700" fill="#fff">Quick start</text>
  <g font-family="Segoe UI,Arial">
    <rect x="55" y="95" width="620" height="515" rx="25" fill="#10182f" stroke="#35e9ff" stroke-width="2"/>
    <rect x="725" y="95" width="620" height="515" rx="25" fill="#19112e" stroke="#ff35b6" stroke-width="2"/>
    <text x="365" y="145" text-anchor="middle" font-size="28" font-weight="700" fill="#62ecff">HOST</text>
    <text x="1035" y="145" text-anchor="middle" font-size="28" font-weight="700" fill="#ff68ca">PLAYER</text>
    <g font-size="19" fill="#fff">
      <g transform="translate(90 180)"><circle cx="28" cy="28" r="28" fill="#16384b" stroke="#35e9ff"/><text x="28" y="35" text-anchor="middle" font-weight="700">1</text><text x="75" y="23">Install ViGEmBus on Windows</text><text x="75" y="48" fill="#a9b9d5" font-size="15">One-time Host requirement</text></g>
      <g transform="translate(90 265)"><circle cx="28" cy="28" r="28" fill="#16384b" stroke="#35e9ff"/><text x="28" y="35" text-anchor="middle" font-weight="700">2</text><text x="75" y="23">Open ArcadeBridgeHost.exe</text><text x="75" y="48" fill="#a9b9d5" font-size="15">The EXE already includes .NET</text></g>
      <g transform="translate(90 350)"><circle cx="28" cy="28" r="28" fill="#16384b" stroke="#35e9ff"/><text x="28" y="35" text-anchor="middle" font-weight="700">3</text><text x="75" y="23">Create a room and connect</text><text x="75" y="48" fill="#a9b9d5" font-size="15">Use the setup wizard</text></g>
      <g transform="translate(90 435)"><circle cx="28" cy="28" r="28" fill="#16384b" stroke="#35e9ff"/><text x="28" y="35" text-anchor="middle" font-weight="700">4</text><text x="75" y="23">Share the controller page + code</text><text x="75" y="48" fill="#a9b9d5" font-size="15">Send the password separately</text></g>
      <g transform="translate(760 180)"><circle cx="28" cy="28" r="28" fill="#451436" stroke="#ff35b6"/><text x="28" y="35" text-anchor="middle" font-weight="700">1</text><text x="75" y="23">Open the controller webpage</text><text x="75" y="48" fill="#cdb6cf" font-size="15">No ArcadeBridge player app required</text></g>
      <g transform="translate(760 280)"><circle cx="28" cy="28" r="28" fill="#451436" stroke="#ff35b6"/><text x="28" y="35" text-anchor="middle" font-weight="700">2</text><text x="75" y="23">Enter name, code, and password</text><text x="75" y="48" fill="#cdb6cf" font-size="15">The name helps the Host assign a slot</text></g>
      <g transform="translate(760 380)"><circle cx="28" cy="28" r="28" fill="#451436" stroke="#ff35b6"/><text x="28" y="35" text-anchor="middle" font-weight="700">3</text><text x="75" y="23">Connect, map, and calibrate</text><text x="75" y="48" fill="#cdb6cf" font-size="15">Xbox 360 output is the default</text></g>
      <g transform="translate(760 480)"><circle cx="28" cy="28" r="28" fill="#451436" stroke="#ff35b6"/><text x="28" y="35" text-anchor="middle" font-weight="700">4</text><text x="75" y="23">Press Ready and play</text><text x="75" y="48" fill="#cdb6cf" font-size="15">Input travels to the assigned Host slot</text></g>
    </g>
    <path d="M675 352H725" stroke="url(#a)" stroke-width="6" marker-end="url(#m)"/>
    <text x="700" y="645" text-anchor="middle" font-size="17" fill="#b8c6df">Host controls slot assignment, room lock, removal, and temporary room bans.</text>
  </g>
</svg>
