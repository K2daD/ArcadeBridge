<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
  <title id="title">ArcadeBridge</title>
  <desc id="desc">Remote browser controllers connected to a Windows gaming host.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b1f"/><stop offset=".55" stop-color="#171035"/><stop offset="1" stop-color="#260923"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#35e9ff"/><stop offset="1" stop-color="#ff2bad"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#51dfff" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1400" height="460" rx="26" fill="url(#bg)"/>
  <rect width="1400" height="460" rx="26" fill="url(#grid)"/>
  <path d="M0 385L210 235 390 350 585 150 770 310 950 130 1190 320 1400 180V460H0Z" fill="#0a102b" opacity=".75"/>
  <g transform="translate(90 96)" fill="none" stroke="url(#neon)" stroke-width="8" filter="url(#glow)">
    <path d="M56 94C67 38 107 14 157 20l37 13h100l37-13c50-6 90 18 101 74l19 102c8 43-8 93-48 99-30 5-50-20-69-59l-25-50H179l-25 50c-19 39-39 64-69 59-40-6-56-56-48-99Z"/>
    <circle cx="140" cy="109" r="25"/><circle cx="332" cy="128" r="25"/>
    <path d="M116 172h48M140 148v48"/>
    <circle cx="350" cy="78" r="7" fill="#ff2bad" stroke="none"/><circle cx="380" cy="108" r="7" fill="#35e9ff" stroke="none"/><circle cx="320" cy="108" r="7" fill="#35e9ff" stroke="none"/><circle cx="350" cy="138" r="7" fill="#ff2bad" stroke="none"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="630" y="155" font-size="78" font-weight="800" fill="#fff">Arcade<tspan fill="#ff38b8">Bridge</tspan></text>
    <text x="634" y="210" font-size="28" fill="#70ecff">Remote controllers. Local games. One simple bridge.</text>
    <text x="634" y="273" font-size="22" fill="#d9dcf7">Up to four browser players → virtual gamepads on Windows</text>
    <g transform="translate(634 315)" font-size="17" font-weight="600">
      <rect width="155" height="43" rx="21" fill="#11283a" stroke="#35e9ff"/><text x="77" y="28" text-anchor="middle" fill="#8df4ff">NO PLAYER APP</text>
      <rect x="170" width="142" height="43" rx="21" fill="#30112e" stroke="#ff2bad"/><text x="241" y="28" text-anchor="middle" fill="#ff9ada">4 PLAYERS</text>
      <rect x="327" width="175" height="43" rx="21" fill="#171d3e" stroke="#9f8cff"/><text x="414" y="28" text-anchor="middle" fill="#c8beff">XBOX 360 / DS4</text>
    </g>
  </g>
  <rect x="4" y="4" width="1392" height="452" rx="23" fill="none" stroke="url(#neon)" stroke-width="3"/>
</svg>
