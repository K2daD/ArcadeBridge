services:
  vrarcade-relay:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: vrarcade-relay

    ports:
      - "26761:26761"

    restart: unless-stopped

    read_only: true

    tmpfs:
      - /tmp:size=64m

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    environment:
      ASPNETCORE_URLS: http://0.0.0.0:26761
      DOTNET_EnableDiagnostics: "0"

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"